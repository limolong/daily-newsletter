name: Daily AI & Finance Newsletter

on:
  schedule:
    # 每天 08:30 UTC 运行 (北京时间 16:30)
    - cron: '30 8 * * *'
  workflow_dispatch:
    # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Create environment file
        run: |
          echo "SMTP_SERVER=${{ secrets.SMTP_SERVER }}" > .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
          echo "TO_EMAILS=${{ secrets.TO_EMAILS }}" >> .env
      
      - name: Run newsletter script
        run: python daily_newsletter.py
      
      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: daily_report_*.html
          retention-days: 30

      - name: Commit report to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add daily_report_*.html
          git commit -m "Update daily report $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push

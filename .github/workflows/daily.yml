name: Daily AI & Finance Newsletter

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Debug environment
        run: |
          echo "SMTP_SERVER is set: ${{ secrets.SMTP_SERVER != '' }}"
          echo "SMTP_PORT is set: ${{ secrets.SMTP_PORT != '' }}"
          echo "SMTP_USER is set: ${{ secrets.SMTP_USER != '' }}"
          echo "SMTP_PASSWORD is set: ${{ secrets.SMTP_PASSWORD != '' }}"
          echo "TO_EMAILS is set: ${{ secrets.TO_EMAILS != '' }}"
      
      - name: Create environment file
        run: |
          echo "SMTP_SERVER=${{ secrets.SMTP_SERVER }}" > .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
          echo "TO_EMAILS=${{ secrets.TO_EMAILS }}" >> .env
      
      - name: Run newsletter script
        run: python daily_newsletter.py
        
      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: daily_report_*.html
          retention-days: 30
